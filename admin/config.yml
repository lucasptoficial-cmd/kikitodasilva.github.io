backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "conteudo"
    label: "Conteúdo do Site"
    files:
      - file: "content/geral.json"
        label: "Informações Gerais"
        name: "geral"
        fields:
          - { label: "Título do Canal", name: "titulo", widget: "string" }
          - { label: "Subtítulo / Slogan", name: "slogan", widget: "string" }
          - { label: "IP do Servidor", name: "ip_servidor", widget: "string" }
          - { label: "Link do YouTube", name: "link_youtube", widget: "string" }
